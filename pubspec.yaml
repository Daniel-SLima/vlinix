name: vlinix
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Ícones e dependências do projeto
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  intl: ^0.20.2
  http: ^1.6.0
  image_picker: ^1.2.1
  mask_text_input_formatter: ^2.9.0
  googleapis: ^16.0.0
  excel: ^4.0.6
  universal_html: ^2.3.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/Roboto_LICENSE.txt


  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
